name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra paceboard

    - name: Run integration tests
      run: uv run pytest tests/integration tests/unit -v --tb=short
      timeout-minutes: 5

    - name: Run Paceboard backend tests
      run: uv run --extra paceboard pytest tests/paceboard -v --tb=short
      timeout-minutes: 10

    - name: Test summary
      if: always()
      run: |
        echo "Tests completed for Python ${{ matrix.python-version }}"
        if [ $? -eq 0 ]; then
          echo "✅ All tests passed"
        else
          echo "❌ Some tests failed"
        fi

  dashboard:
    name: Dashboard (typecheck, lint, build, e2e)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install Python dependencies
      run: uv sync --extra paceboard

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - name: Install dashboard dependencies
      working-directory: dashboard
      run: npm ci

    - name: Type-check
      working-directory: dashboard
      run: npm run typecheck

    - name: Lint
      working-directory: dashboard
      run: npm run lint

    - name: Production build
      working-directory: dashboard
      run: npm run build

    - name: Install Playwright browser
      working-directory: dashboard
      run: npx playwright install --with-deps chromium

    # Runs in fixture mode against a scratch database; no credentials needed.
    - name: End-to-end tests
      working-directory: dashboard
      run: npx playwright test
      timeout-minutes: 15

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: dashboard/playwright-report/
        retention-days: 7
